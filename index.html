<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="공유받은 강의를 해밀리헬스 앱에서 확인하세요.">
  <meta property="og:title" content="해밀리헬스 강의">
  <meta property="og:description" content="공유받은 강의를 해밀리헬스 앱에서 확인하세요.">
  <meta property="og:type" content="website">
  <title>해밀리헬스 · 강의 보기</title>
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="stylesheet" href="styles.css?v=20261029-ios-manual">
  <script type="module" src="app.mjs?v=20261029-ios-manual"></script>
</head>
<body>
  <main>
    <img class="logo" src="app-icon.png" width="96" height="96" alt="해밀리헬스">
    <h1 id="heading" hidden>해밀리헬스 앱으로 이동중이에요</h1>
    <p id="message" role="status" aria-live="polite" hidden>자동으로 연결이 안되면 아래 버튼을 눌러주세요</p>
    <div class="action">
      <button id="connect" type="button" hidden disabled>앱에서 강의 보기</button>
      <button id="install" type="button" hidden disabled>앱 설치하기</button>
    </div>
    <noscript><p>브라우저에서 JavaScript를 허용한 뒤 다시 열어주세요.</p></noscript>
  </main>
</body>
</html>
