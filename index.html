<!doctype html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">

  <meta property="og:title" content="해밀리헬스 강의">

<body>
  <main>
    <section class="intro" aria-label="앱 연결 안내">

      <h1 id="heading">해밀리헬스 앱으로

    <div class="action">

    </div>
